name: CI

# Makes the README's existing CI/CD claim true (plan.md Section 3: "GitHub
# Actions CI ... Makes the README's existing (currently false) CI/CD claim
# true"). Phase-0 exit criterion: pytest is green in CI on a fresh clone,
# zero manual setup steps.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore
